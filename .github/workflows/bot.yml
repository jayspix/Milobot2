name: Run Milo Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install -r requirements.txt

      - name: Install Chrome and matching ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install Chrome system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libx11-xcb1 libxcb-dri3-0 libdrm2 libgbm1 libasound2t64

      - run: python milo_bot.py
